<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Лабиринт забытой библиотеки — красивые двери</title>
<style>
:root{--bg:#100e0b;--ink:#f0e4cd;--gold:#dfbd80;--gold2:#a87b43;--muted:#c2ad8f;--line:rgba(225,187,121,.23);--panel:rgba(29,22,17,.93);--serif:Georgia,'Times New Roman',serif}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#100e0b;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer;color:inherit}
button:disabled{cursor:not-allowed;opacity:.4}
button:focus-visible,input:focus-visible{outline:2px solid #f7d9a0;outline-offset:4px}
button:active:not(:disabled){transform:translateY(1px)}
#app{position:relative;width:100%;height:100%;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 50% 26%,#32241a 0%,#1d1814 52%,#100e0b 100%)}
.room-art{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.98}
.vignette{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(8,7,6,.65),transparent 28%,transparent 68%,rgba(10,8,7,.72)),radial-gradient(ellipse at center,transparent 27%,rgba(5,4,4,.75) 95%);z-index:1}
.grain{position:absolute;inset:0;pointer-events:none;z-index:2;opacity:.12;background-image:url('data:image/svg+xml,%3Csvg viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="n"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.35" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23n)" opacity=".4"/%3E%3C/svg%3E')}
.dust{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.dust span{position:absolute;display:block;border-radius:50%;width:3px;height:3px;background:#fce1a7;box-shadow:0 0 9px 2px rgba(255,196,94,.32);opacity:.28;animation:float 18s linear infinite}
@keyframes float{0%{transform:translate3d(0,20px,0);opacity:0}15%{opacity:.45}80%{opacity:.25}100%{transform:translate3d(24px,-100px,0);opacity:0}}
button.primary{border:1px solid rgba(255,223,158,.62);background:linear-gradient(180deg,#dfbd80,#ad7c41);box-shadow:0 10px 30px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.35);color:#1c120a;border-radius:12px;font-weight:750;padding:14px 22px}
button.ghost{border:1px solid var(--line);border-radius:12px;background:rgba(28,21,15,.75);padding:12px 16px;color:#e6d4b9}
button.ghost:hover,button.minibtn:hover{background:rgba(119,85,48,.23)}
button.minibtn{border:1px solid rgba(236,190,118,.2);background:rgba(24,18,14,.74);border-radius:11px;padding:9px 12px;font-size:13px;color:var(--muted)}
.topbar{position:absolute;z-index:9;top:0;left:0;right:0;padding:21px clamp(20px,3.5vw,54px);display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{display:flex;align-items:center;gap:12px}
.brand-sigil{display:grid;place-items:center;width:42px;height:42px;border:1px solid rgba(243,207,139,.55);border-radius:12px;color:var(--gold);font-family:var(--serif);font-size:26px;background:rgba(26,19,13,.75);box-shadow:0 0 18px rgba(230,176,82,.14)}
.brand-label{font-family:var(--serif);font-size:clamp(18px,2vw,28px);letter-spacing:.03em;line-height:1.1}
.brand-sub{margin-top:5px;color:#bea88a;font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.hud{position:absolute;z-index:6;top:95px;left:clamp(20px,3.5vw,54px);right:clamp(20px,3.5vw,54px);display:flex;align-items:center;justify-content:space-between;gap:20px}
.hud-left{display:flex;gap:10px;flex-wrap:wrap}
.hud-stat{min-width:117px;border:1px solid var(--line);border-radius:13px;background:rgba(21,16,12,.74);backdrop-filter:blur(8px);padding:9px 15px}
.hud-label{color:#c4ae8b;text-transform:uppercase;letter-spacing:.11em;font-size:10px}
.hud-value{font-family:var(--serif);font-size:22px;margin-top:2px;color:#f1ddb6}
.hud-right{font-size:13px;color:#d4bd99;text-align:right;max-width:300px;line-height:1.5}
.view{position:relative;z-index:5;height:100%;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:145px 35px 72px}
.welcome{width:min(730px,88vw);background:linear-gradient(180deg,rgba(27,20,15,.86),rgba(16,12,10,.91));border:1px solid rgba(231,196,126,.38);box-shadow:0 20px 90px rgba(0,0,0,.62),inset 0 0 55px rgba(162,98,41,.06);border-radius:25px;padding:clamp(24px,4vw,48px);position:relative}
.welcome:before,.scrollPanel:before{content:'✧';position:absolute;top:-19px;left:50%;transform:translateX(-50%);background:#241a12;color:#f4d8a2;border:1px solid rgba(227,185,108,.36);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:24px}
.eyebrow{font-size:12px;letter-spacing:.25em;color:#d9b575;text-transform:uppercase;margin:0 0 14px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--serif);font-weight:500}
.welcome h1{font-size:clamp(37px,4.8vw,65px);line-height:1.05;color:#f2dec0;text-shadow:0 0 40px rgba(234,180,94,.13)}
.welcome .lead{font-size:clamp(15px,1.45vw,18px);line-height:1.7;color:#d3baa0;margin:20px auto 24px;max-width:610px}
.time-controls{display:flex;align-items:center;justify-content:center;gap:13px;margin:16px 0 12px;flex-wrap:wrap}
.time-control{display:flex;align-items:center;gap:9px;background:rgba(9,8,7,.56);border:1px solid rgba(230,192,127,.3);border-radius:13px;padding:8px 12px}
.time-control input{border:0;background:transparent;color:#fff1ce;width:70px;font-family:var(--serif);font-size:30px;text-align:center;appearance:textfield;-moz-appearance:textfield}
.time-control input::-webkit-outer-spin-button,.time-control input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.time-control span{font-size:14px;color:#ccb28d}
.note{color:#aa9477;font-size:13px;line-height:1.5}
.welcome .primary{font-size:17px;min-width:260px;margin-top:18px}
.room-heading{position:absolute;top:21%;width:min(790px,90vw);z-index:5;text-shadow:0 4px 20px #0b0908}
.room-heading .chapter{font-size:12px;letter-spacing:.26em;color:#d9b574;text-transform:uppercase;margin-bottom:8px}
.room-heading h2{font-size:clamp(29px,3vw,48px);color:#f1dec2}
.room-heading p{font-size:15px;color:#bba58a;margin-top:8px}
.doors{position:absolute;bottom:12%;width:min(1080px,90vw);display:grid;grid-template-columns:repeat(3,1fr);align-items:end;gap:clamp(18px,3vw,45px);z-index:5}
.door{--doorwood:#57351f;--light:#ecbd71;position:relative;min-width:0;min-height:clamp(240px,34vh,365px);background:transparent;border:0;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;filter:drop-shadow(0 12px 25px rgba(0,0,0,.55));transition:transform .25s ease,filter .25s ease}
.door:not(:disabled):hover{transform:translateY(-8px) scale(1.02);filter:drop-shadow(0 0 22px rgba(237,180,83,.22)) drop-shadow(0 15px 24px rgba(0,0,0,.65))}
.door.blocked{filter:grayscale(.9);opacity:.4}
.door-arch{position:relative;width:min(100%,215px);height:clamp(215px,31vh,329px);border:9px solid #382718;border-bottom:15px solid #27180f;border-radius:112px 112px 9px 9px;box-shadow:inset 0 0 0 2px rgba(238,187,111,.19),inset 0 0 17px 10px rgba(13,9,7,.7),0 0 0 2px rgba(172,121,65,.65),0 0 0 8px #20160f;background:linear-gradient(135deg,rgba(193,138,71,.38),transparent 19%),repeating-linear-gradient(90deg,rgba(20,12,8,.12) 0 14px,rgba(244,187,111,.04) 15px 17px,transparent 20px 35px),linear-gradient(120deg,#684328 0%,#3b281b 48%,#5c3c23 100%);overflow:hidden}
.door-arch:before{content:'';position:absolute;inset:16px 12px 12px;border:2px solid rgba(195,151,89,.48);border-radius:100px 100px 3px 3px;box-shadow:inset 0 0 0 8px rgba(29,18,12,.15)}
.door-arch:after{content:'';position:absolute;inset:50% 20px 20px;border:1px solid rgba(240,197,125,.18);border-radius:5px;box-shadow:inset 0 0 0 11px rgba(37,20,12,.2)}
.door-symbol{position:absolute;top:24%;left:50%;transform:translateX(-50%);font-family:var(--serif);font-size:37px;color:#d9b879;text-shadow:0 0 16px rgba(252,222,162,.25);z-index:2}
.door-handle{position:absolute;top:60%;right:17%;width:16px;height:16px;border:3px solid #f3d9a2;border-radius:50%;box-shadow:0 0 0 3px #9b713a,0 0 16px rgba(255,211,130,.36);z-index:2}
.door-num{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#e8c489;margin-top:19px}
.door-caption{font-family:var(--serif);font-size:20px;color:#eddbc0;margin-top:6px}
.door-hint{color:#a68d71;font-size:12px;margin-top:6px}
.door.blocked .door-caption{text-decoration:line-through}
.door.locked .door-symbol{opacity:.45}
.room-foot{position:absolute;bottom:3%;z-index:6;color:rgba(216,187,146,.72);font-size:12px;letter-spacing:.07em}
.overlay-bg{position:fixed;inset:0;background:rgba(5,4,4,.74);backdrop-filter:blur(8px);z-index:30;display:flex;align-items:center;justify-content:center;padding:22px}
.scrollPanel{position:relative;width:min(640px,95vw);max-height:90vh;overflow:auto;border:1px solid rgba(234,196,128,.54);border-radius:20px;background:radial-gradient(ellipse at 50% 0%,rgba(153,98,48,.24),transparent 65%),linear-gradient(180deg,#2e2219,#17120f);padding:35px clamp(20px,4vw,45px);box-shadow:0 32px 95px rgba(0,0,0,.7),inset 0 0 70px rgba(165,113,60,.06);text-align:center}
.scrollPanel .event-icon{font-size:49px;line-height:1.2;filter:drop-shadow(0 0 18px rgba(239,180,86,.19))}
.scrollPanel h2{font-size:clamp(29px,4vw,42px);margin:15px 0 10px}
.scrollPanel p{font-size:16px;line-height:1.7;color:#ceb79a}
.scrollPanel .rule{height:1px;margin:25px auto;background:linear-gradient(90deg,transparent,rgba(225,193,128,.5),transparent)}
.scrollPanel .duration{font-family:var(--serif);font-size:60px;color:#ffdda4;line-height:1.15;margin:6px 0 16px}
.scrollPanel .button-row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:22px}
.scrollPanel .button-row button{min-width:145px}
.save-tip{font-size:12px;color:#a68e74;margin-top:12px}
.timer-focus{position:fixed;z-index:80;inset:0;background:radial-gradient(ellipse at 50% 48%,#35281b 0%,#15120f 51%,#090908 100%);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:26px}
.timer-focus:before{content:'';position:absolute;inset:0;opacity:.4;pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(241,176,72,.13),transparent 53%)}
.timer-ring{position:relative;width:min(63vmin,510px);height:min(63vmin,510px);display:grid;place-items:center}
.timer-ring svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 12px rgba(236,178,94,.21))}
.timer-track{fill:none;stroke:rgba(229,188,119,.12);stroke-width:7}
.timer-arc{fill:none;stroke:#efc88a;stroke-width:8;transform:rotate(-90deg);transform-origin:50% 50%;filter:drop-shadow(0 0 9px rgba(239,177,89,.62))}
.timer-dot{fill:#ffe8b9;filter:drop-shadow(0 0 7px rgba(255,209,131,.95))}
.timer-number{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:clamp(48px,7vmin,93px);color:#fff0d4;text-shadow:0 0 29px rgba(255,196,108,.2)}
.timer-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.timer-small{color:#ac977e;font-size:14px;text-align:center}
.timer-focus.fullscreen .timer-actions,.timer-focus.fullscreen .timer-small{display:none}
.timer-focus.fullscreen .timer-ring{width:min(75vmin,700px);height:min(75vmin,700px)}
.timer-focus.fullscreen .timer-number{font-size:clamp(52px,8.4vmin,119px)}
.toast{position:fixed;z-index:200;bottom:24px;left:50%;transform:translateX(-50%);background:#3a281c;border:1px solid #bb9156;border-radius:13px;padding:12px 20px;color:#f9e9ce;box-shadow:0 12px 40px #0009;max-width:90vw;text-align:center}
.log{max-height:260px;overflow:auto;text-align:left;border:1px solid var(--line);border-radius:12px;padding:12px;color:#d6bd98;font-size:13px;line-height:1.8;background:#100d0bb8}
.log-item{border-bottom:1px solid rgba(226,179,107,.12);padding:5px 0}
.log-item:last-child{border-bottom:0}
.completed-banner{margin-top:12px;padding:14px;background:rgba(210,153,67,.1);border:1px solid rgba(227,184,112,.28);border-radius:12px;color:#d9c19b}
.hidden{display:none!important}
@media(max-width:800px){.topbar{padding:15px}.brand-label{font-size:18px}.brand-sub{display:none}.toolbar .minibtn{font-size:11px;padding:7px}.hud{top:82px;left:15px;right:15px}.hud-stat{min-width:95px;padding:7px}.hud-value{font-size:19px}.hud-right{display:none}.room-heading{top:23%}.room-heading h2{font-size:28px}.doors{width:96%;gap:10px;bottom:12%}.door-arch{height:clamp(180px,29vh,290px);border-width:5px}.door-caption{font-size:14px}.door-hint{display:none}.door-num{font-size:10px}.view{padding:115px 14px 62px}.welcome{width:96vw;padding:25px 16px}.timer-ring{width:min(78vmin,500px);height:min(78vmin,500px)}}
@media(max-height:690px){.hud{top:78px}.room-heading{top:24%}.door-arch{height:28vh;min-height:170px}.doors{bottom:12%}.door-num{margin-top:9px}.view{padding-top:110px}.welcome{padding:24px}.welcome h1{font-size:42px}.welcome .lead{margin:12px 0}.time-controls{margin:10px 0}}
@media(prefers-reduced-motion:reduce){.dust span,.door{animation:none!important;transition:none!important}}

  function importSave(file){
    if(!file)return;
    const reader=new FileReader();reader.onload=()=>{
      try{
        const s=JSON.parse(reader.result);
        if(!s||s.v!==APP_VERSION||!(s.maxMinutes>=15&&s.maxMinutes<=720)||!Number.isFinite(s.studiedSec)||!Array.isArray(s.history)||!['choose','reveal','study','post','win'].includes(s.phase)||!s.room||!Array.isArray(s.room.doors))throw new Error('invalid');
        if(s.phase==='study'&&(!s.timer||!Number.isFinite(s.timer.durationMs)))throw new Error('invalid timer');
        state=s;save();render();openToast('Игра загружена из файла.');
      }catch(e){openToast('Не удалось загрузить сохранение этой версии игры.');}
    };reader.readAsText(file);
  }
  function restoreAuto(){
    const stored=load();if(stored){state=stored;render();openToast('Игра восстановлена из последнего сохранения.')}else showWelcome();
  }
  window.addEventListener('focus',()=>{if(state&&state.phase==='study')tick()});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state&&state.phase==='study')tick()});
  document.addEventListener('fullscreenchange',updateFullscreenClass);
  document.addEventListener('keydown',(e)=>{if(e.shiftKey&&e.key.toLowerCase()==='n'){e.preventDefault();confirmRestart();return;}if(e.code==='Space'&&state&&state.phase==='study'){e.preventDefault();pauseToggle();}if(e.key==='Escape'&&$('dialogRoot').className==='overlay-bg'){if($('dialogRoot').querySelector('#closeHistory')){$('dialogRoot').className='hidden';$('dialogRoot').innerHTML=''}}});
  $('soundTest').onclick=testSound;$('saveBtn').onclick=exportSave;$('loadBtn').onclick=()=>$('saveInput').click();
  $('saveInput').onchange=e=>{importSave(e.target.files[0]);e.target.value='';};
  $('historyBtn').onclick=showHistory;
  $('newGameBtn').onclick=confirmRestart;
  $('fullscreenBtn').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>openToast('Полноэкранный режим недоступен.'));else document.exitFullscreen?.();};
  const autoFitObserver=new MutationObserver(scheduleCardFit);
  autoFitObserver.observe($('view'),{childList:true});
  autoFitObserver.observe($('dialogRoot'),{childList:true});
  window.addEventListener('resize',scheduleCardFit);
  setAmbience();restoreAuto();tickHandle=setInterval(tick,125);scheduleCardFit();
})();
</script>
</body>
</html>
